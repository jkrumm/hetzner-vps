---
# Local dev infra — Postgres + Valkey with ports exposed for direct app connections.
# Uses op run --env-file=.env.tpl via OP_RUN in Makefile.
# Usage: make up (with ENV=dev in .env)
#        make postgres-setup (provisions schemas/users)

services:

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:9
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - valkey-dev-data:/data

  # FPP MariaDB — dev only (no TLS). Host port 13306 to avoid collisions with
  # other local MySQL instances (e.g. work projects on 3306). Prod compose at
  # apps/fpp/compose.yml binds 33306 publicly for Vercel.
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    environment:
      MARIADB_DATABASE: ${MARIADB_DB}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mariadb-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # ClickStack — all-in-one observability (ClickHouse + OTel Collector + HyperDX UI + MongoDB).
  # UI: http://hyperdx.local (configure via localias)
  # Apps: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  # First visit → create admin account (persisted in volume).
  # ---------------------------------------------------------------------------
  clickstack:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: clickstack
    ports:
      - "7707:8080"   # HyperDX UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - clickstack-db:/data/db
      - clickstack-ch-data:/var/lib/clickhouse
      - clickstack-ch-logs:/var/log/clickhouse-server
    environment:
      HYPERDX_LOG_LEVEL: debug
      USAGE_STATS_ENABLED: "false"
      FRONTEND_URL: http://hyperdx.local

volumes:
  postgres-dev-data:
  valkey-dev-data:
  mariadb-dev-data:
  clickstack-db:
  clickstack-ch-data:
  clickstack-ch-logs:
