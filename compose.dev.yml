---
# Local dev infra — Postgres + Valkey with ports exposed for direct app connections.
# Uses Doppler vps/dev config via DOPPLER_RUN in Makefile.
# Usage: make up (with ENV=dev in .env)
#        make postgres-setup (provisions schemas/users)

services:

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:9
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - valkey-dev-data:/data

volumes:
  postgres-dev-data:
  valkey-dev-data:
