## Traefik v3 — Static Configuration
## Deploy: op run --env-file=.env.tpl -- docker compose up -d
##
## NOTE: This file does NOT support ${ENV_VAR} substitution.
## Domain-specific config (wildcard cert domains, ACME email) is handled via:
##   - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL env var in compose.networking.yml
##   - tls.domains labels on the dashboard router in compose.networking.yml

api:
  dashboard: true
  insecure: false

log:
  level: WARN

accessLog:
  bufferingSize: 100

entryPoints:
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        # Wildcard domain is requested via tls.domains labels on the dashboard router.
        # See compose.networking.yml: traefik.http.routers.dashboard.tls.domains[0].*
      middlewares:
        - security-headers@file

certificatesResolvers:
  letsencrypt:
    acme:
      # email set via TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL env var in compose.networking.yml
      storage: /etc/traefik/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

# OTLP export to ClickStack (reached via monitoring-net).
# Endpoints + service name live here; the authorization header is injected via
# TRAEFIK_TRACING_OTLP_HTTP_HEADERS_authorization and TRAEFIK_METRICS_OTLP_HTTP_HEADERS_authorization
# env vars in compose.networking.yml — Traefik 3.x doesn't substitute ${VAR}
# inside YAML header values (empirically: spans never landed when configured that way).
tracing:
  otlp:
    http:
      endpoint: http://clickstack:4318/v1/traces
  serviceName: traefik
  sampleRate: 1.0

metrics:
  otlp:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    pushInterval: 30s
    http:
      endpoint: http://clickstack:4318/v1/metrics
