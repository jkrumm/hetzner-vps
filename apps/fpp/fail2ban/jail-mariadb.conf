# MariaDB jail.
# Watches journald for auth failures, bans source IPs at the iptables DOCKER-USER chain
# (UFW rules don't apply to Docker-published ports — DOCKER-USER is the chain Docker
# evaluates BEFORE its NAT rules, so dropping there actually blocks the traffic).
# Installed at /etc/fail2ban/jail.d/mariadb.conf by scripts/setup.sh.

[mariadb]
enabled  = true
backend  = systemd
filter   = mariadb-auth
maxretry = 5
findtime = 10m
bantime  = 1h
# Ban applies to all ports on the source IP at the DOCKER-USER chain.
action   = iptables-allports[name=mariadb, chain=DOCKER-USER]
