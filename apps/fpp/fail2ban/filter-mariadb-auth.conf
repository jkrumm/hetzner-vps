# MariaDB authentication failure filter.
# Matches journald entries from the mariadb container (CONTAINER_TAG=mariadb).
# Installed at /etc/fail2ban/filter.d/mariadb-auth.conf by scripts/setup.sh.

[Definition]

# MariaDB 11.x logs failed auth at WARNING level:
#   [Warning] Access denied for user 'fpp'@'1.2.3.4' (using password: YES)
# Note there is NO whitespace around the '@' — a ' @ ' pattern never matches.
#
# Deliberately does NOT match "Aborted connection": that is a clean-authentication
# event (the client already passed auth) emitted whenever a connection drops without
# a proper close. Vercel's serverless lifecycle does this constantly, so matching it
# bans legitimate production traffic while catching no attacker.
failregex = ^.*\[Warning\] Access denied for user .*@'<HOST>'.*$

ignoreregex =

# systemd backend matches CONTAINER_TAG=mariadb, set in apps/fpp/compose.yml logging.tag.
journalmatch = CONTAINER_TAG=mariadb
