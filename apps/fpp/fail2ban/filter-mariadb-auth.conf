# MariaDB authentication failure filter.
# Matches journald entries from the mariadb container (CONTAINER_TAG=mariadb).
# Installed at /etc/fail2ban/filter.d/mariadb-auth.conf by scripts/setup.sh.

[Definition]

# MariaDB 11.x logs failed auth at WARNING level. Two common variants:
#   [Warning] Access denied for user 'fpp'@'1.2.3.4' (using password: YES)
#   [Warning] Aborted connection ... user: 'fpp' host: '1.2.3.4' (Got an error reading communication packets)
failregex = ^.*\[Warning\] Access denied for user .* @ '?<HOST>'?( \(.*\))?\s*$
            ^.*\[Warning\] Aborted connection .* host: '<HOST>' .*$

ignoreregex =

# systemd backend matches CONTAINER_TAG=mariadb, set in apps/fpp/compose.yml logging.tag.
journalmatch = CONTAINER_TAG=mariadb
