# Production compose for the VPS — meteo edge. Mirrors apps/research-gateway.
#
# Public via the Cloudflare Tunnel (CNAME meteo.${DOMAIN} → the tunnel, orange cloud),
# the same door as fpp. The container is nginx: it serves the built map and the basemap
# archive itself and proxies the forecast API over the tailnet to the tileserver on the
# Mac mini, caching responses on disk for exactly the TTL the origin sets. The mini does
# every computation; nothing here renders a tile.
#
# `.env` here holds MINI_TAILSCALE_IP and MINI_TAILNET_HOST, written by `make meteo-env`
# from the VPS's own tailscale peer list — no 1Password item, nothing tracked.
# The mini side of the hop is `tailscale serve` on :8081 (dotfiles-private
# tailscale-serve.mini.conf) plus a tag:vps → tag:devhost tcp:8081 ACL grant.
#
# /var/lib/meteo/basemap is the 8 GB planet PMTiles extract plus sprites and glyphs,
# copied once from the mini with `make basemap-push` in the meteo repo. Not a volume:
# rsync needs a host path, and the file changes about once a year.

services:
  meteo-edge:
    image: ${METEO_EDGE_IMAGE:-${IMAGE_TAG:-rollhook.jkrumm.com/meteo-edge:latest}}
    restart: unless-stopped
    env_file:
      - .env
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/lib/meteo/basemap:/srv/basemap:ro
      - meteo-edge-cache:/var/cache/nginx
    networks:
      - proxy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first and nginx
      # answers on IPv4 — the first start sat at "health: starting" with connection refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meteo.rule=Host(`meteo.${DOMAIN}`)"
      - "traefik.http.routers.meteo.entrypoints=websecure"
      - "traefik.http.routers.meteo.tls.certresolver=letsencrypt"
      # Own rate limit, not rate-limit@file: the map's timeline warmer legitimately fires
      # thousands of tile requests in a burst, and the shared 100/s + 200 burst would
      # answer that with 429s the client renders as gaps.
      - "traefik.http.middlewares.meteo-ratelimit.ratelimit.average=300"
      - "traefik.http.middlewares.meteo-ratelimit.ratelimit.burst=1500"
      - "traefik.http.middlewares.meteo-ratelimit.ratelimit.period=1s"
      - "traefik.http.routers.meteo.middlewares=meteo-ratelimit@docker,security-headers@file"
      - "traefik.http.services.meteo.loadbalancer.server.port=8080"
      - "traefik.http.services.meteo.loadbalancer.healthcheck.path=/health"
      - "com.centurylinklabs.watchtower.enable=false"
      # rollhook OIDC authorization — only this repo may deploy this container
      - "rollhook.allowed_repos=jkrumm/meteo"

networks:
  proxy:
    external: true

volumes:
  meteo-edge-cache:
