# Production compose for the VPS — research-gateway. Mirrors apps/audio-gateway / apps/argo.
# Tailscale-only via DNS-only (grey) A record research.${DOMAIN} -> VPS Tailscale IP.
# NOT behind the cloudflared tunnel — same pattern as argo.jkrumm.com / audio-gateway.jkrumm.com.
# Traefik labels are identical to a public service; tailnet-only is enforced at the DNS layer.
# Deploys are label-driven via rollhook (OIDC). `${DOMAIN}` from the vps top-level .env;
# `.env` here is materialized by `op inject`.

services:
  research-gateway:
    image: ${RESEARCH_GATEWAY_IMAGE:-${IMAGE_TAG:-rollhook.jkrumm.com/research-gateway:latest}}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 7780
      NODE_ENV: production
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - monitoring-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7780/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.research-gateway.rule=Host(`research.${DOMAIN}`)"
      - "traefik.http.routers.research-gateway.entrypoints=websecure"
      - "traefik.http.routers.research-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.routers.research-gateway.middlewares=security-headers@file"
      - "traefik.http.services.research-gateway.loadbalancer.server.port=7780"
      - "traefik.http.services.research-gateway.loadbalancer.healthcheck.path=/health"
      - "com.centurylinklabs.watchtower.enable=false"
      # rollhook OIDC authorization — only this repo may deploy this container
      - "rollhook.allowed_repos=jkrumm/research-gateway"

networks:
  proxy:
    external: true
  monitoring-net:
    external: true
