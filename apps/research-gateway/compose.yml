# Production compose for the VPS — research-gateway. Mirrors apps/audio-gateway / apps/argo.
# Tailscale-only via DNS-only (grey) A record research.${DOMAIN} -> VPS Tailscale IP.
# NOT behind the cloudflared tunnel — same pattern as argo.jkrumm.com / audio-gateway.jkrumm.com.
# Traefik labels are identical to a public service; tailnet-only is enforced at the DNS layer.
# Deploys are label-driven via rollhook (OIDC). `${DOMAIN}` from the vps top-level .env;
# `.env` here is materialized by `op inject`.
# `research-gateway-data` holds the bun:sqlite job store (lib/job-db.ts) at /app/data — status-
# only durability so a done job's result and an in-flight job's status survive a redeploy.
# The image creates /app/data owned by app:app; Docker seeds an empty named volume from the
# image directory, so that ownership is what keeps the non-root user able to write here.

services:
  research-gateway:
    image: ${RESEARCH_GATEWAY_IMAGE:-${IMAGE_TAG:-rollhook.jkrumm.com/research-gateway:latest}}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 7780
      NODE_ENV: production
      # The JavaScript-rendering sidecar below. Deliberately NOT in .env: it is not a secret,
      # and the gateway is meant to be readable without materializing one. Unset it to take
      # the renderer out of the fetch chain without redeploying the gateway image.
      LIGHTPANDA_URL: http://research-gateway-lightpanda:7781
      # Ship the JSON log stream to ClickStack over the unauthed :4319 OTLP port on the docker
      # bridge — same wiring as argo/fpp/imgproxy, and the gateway was already on
      # monitoring-net without using it. Without this, every log dies with the container on
      # each deploy: 72h of prod logs held 513 lines because the container was 20 minutes old,
      # which makes the blocked-host evidence the fetch chain records unusable for picking the
      # next site adapter. Unset it to fall back to console-only logging without a rebuild.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4319
      OTEL_SERVICE_NAME: research-gateway
    # Sized against RESEARCH_MAX_CONCURRENCY=3, the same "concurrency x per-unit memory is ONE
    # decision" reasoning the sidecar's mem_limit below is written up with.
    #
    # Raised 512m -> 1g on 2026-08-06 after the container pinned at 510.1 MiB / 512 MiB with
    # CPU at 222% running just TWO concurrent `standard` jobs. It was not OOM-killed: the
    # process survived and kept executing jobs while its HTTP listener died — no socket left
    # on 7780, `docker inspect` healthcheck FailingStreak 8, every request 404ing, and the
    # in-memory job store taking both in-flight jobs with it. A wedged-but-running container
    # is a worse failure than a clean OOM kill, because restart policies never fire.
    #
    # What made a previously-fine limit too small: video sources. A YouTube page used to
    # return 1,731 chars of player chrome and now returns up to TEXT_CAP (80,000), and
    # `findVideos` pulls ~1.3 MB of search HTML per call. 512m predates both.
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    volumes:
      - research-gateway-data:/app/data
    networks:
      - proxy
      - monitoring-net
      - render
    # NO `depends_on` on the renderer, on purpose. It is one optional step inside a fallback
    # chain — a gateway that refuses to start because the browser sidecar is unhealthy would
    # trade a few percent of fetch quality for a total outage. The gateway treats an
    # unreachable sidecar as a failed render and falls through to Tavily Extract.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7780/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.research-gateway.rule=Host(`research.${DOMAIN}`)"
      - "traefik.http.routers.research-gateway.entrypoints=websecure"
      - "traefik.http.routers.research-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.routers.research-gateway.middlewares=security-headers@file"
      - "traefik.http.services.research-gateway.loadbalancer.server.port=7780"
      - "traefik.http.services.research-gateway.loadbalancer.healthcheck.path=/health"
      - "com.centurylinklabs.watchtower.enable=false"
      # rollhook OIDC authorization — only this repo may deploy this container
      - "rollhook.allowed_repos=jkrumm/research-gateway"

  # JavaScript rendering — a self-hosted browser engine, replacing Jina Reader. Built from the
  # same repo but as its own image (lightpanda/Dockerfile,
  # .github/workflows/deploy-lightpanda.yml), because a browser-version bump and a gateway
  # release have nothing to do with each other.
  #
  # It is a separate CONTAINER rather than a process in the gateway for one measured reason:
  # peak RSS per render is 100-205 MB, and 479 MB on a real page without the V8 heap cap the
  # sidecar applies. Inside the gateway's 512 MiB that is an OOM kill of the whole service —
  # and with an in-memory job store, every in-flight research job dies with it. Out here, the
  # same event costs one fetch, which falls through to Tavily Extract. (The binary is also
  # glibc-linked and cannot run on the gateway's alpine base at all.)
  research-gateway-lightpanda:
    # The nested ${IMAGE_TAG:-...} is REQUIRED, not stylistic: RollHook's validator rejects a
    # service whose image does not reference IMAGE_TAG ("service image must reference
    # IMAGE_TAG"), which is how the sidecar's own deploy workflow was failing while the
    # container ran happily from a hand-built image. Same shape as the gateway above and as
    # both argo services.
    image: ${RESEARCH_GATEWAY_LIGHTPANDA_IMAGE:-${IMAGE_TAG:-rollhook.jkrumm.com/research-gateway-lightpanda:latest}}
    restart: unless-stopped
    environment:
      PORT: 7781
      NODE_ENV: production
      # This number and mem_limit below are one decision, not two: 3 x the measured 205 MB
      # worst-case render + ~50 MB for the Bun wrapper = ~665 MB. Change one, recompute the
      # other. The reasoning and the measurements are in lightpanda/server.ts.
      RENDER_MAX_CONCURRENCY: 3
    mem_limit: 768m
    # The wrapper spawns one browser process per render and SIGKILLs the ones that overrun,
    # so PID 1 here actually has children to reap.
    init: true
    security_opt:
      - no-new-privileges:true
    # Only `render` — no `proxy`, so Traefik cannot route to it and nothing outside this pair
    # can reach it. It still gets NAT egress from this bridge, which it needs: its whole job is
    # fetching public pages.
    networks:
      - render
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7781/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "rollhook.allowed_repos=jkrumm/research-gateway"

networks:
  proxy:
    external: true
  monitoring-net:
    external: true
  # Private to this pair — created by compose, not shared with the rest of the VPS. This is
  # what stands in for authentication on the sidecar: it takes a URL and fetches it, so the set
  # of things able to talk to it is the control that matters.
  render:

volumes:
  research-gateway-data:
